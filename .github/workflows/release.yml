name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            binary="dist/kolang-linter-${os}-${arch}${ext}"
            GOOS="$os" GOARCH="$arch" go build \
              -o "$binary" \
              .
            if [ "$os" = "windows" ]; then
              mkdir -p "dist/pkg-${os}-${arch}"
              cp "$binary" "dist/pkg-${os}-${arch}/kolang-linter.exe"
              (cd "dist/pkg-${os}-${arch}" && zip -qr "../kolang-linter-${os}-${arch}.zip" kolang-linter.exe)
            else
              mkdir -p "dist/pkg-${os}-${arch}"
              cp "$binary" "dist/pkg-${os}-${arch}/kolang-linter"
              tar -czf "dist/kolang-linter-${os}-${arch}.tar.gz" -C "dist/pkg-${os}-${arch}" kolang-linter
            fi
            rm -rf "dist/pkg-${os}-${arch}"
          done
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          name: "لینتر کلنگ نسخه ${{ github.ref_name }}"
          body: |
            ## لینتر کلنگ ${{ github.ref_name }}

            نسخه‌ی جدید لینتر کلنگ منتشر شد! برای نصب:

            ```bash
            brew install faralidev/tap/kolang-linter
            ```

            یا:

            ```bash
            go install github.com/faralidev/kolang-linter@latest
            ```

            یا فایل اجرایی مناسب سیستم‌عامل خود را از زیر دانلود کنید.

            ## Kolang Linter ${{ github.ref_name }}

            New release of Kolang Linter. Install with:

            ```bash
            brew install faralidev/tap/kolang-linter
            ```

            Or:

            ```bash
            go install github.com/faralidev/kolang-linter@latest
            ```

            Or download the binary for your platform below.

  bump-taps:
    name: Bump Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256 for release assets
        id: hashes
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          HB_VERSION="${VERSION#v}"
          mkdir -p /tmp/assets
          declare -A HASHES
          # Releases publish raw binaries (no .tar.gz/.zip archives):
          #   kolang-linter-{linux,darwin}-{amd64,arm64}, kolang-linter-windows-amd64.exe
          for asset in \
            kolang-linter-linux-amd64 \
            kolang-linter-linux-arm64 \
            kolang-linter-darwin-amd64 \
            kolang-linter-darwin-arm64 \
            kolang-linter-windows-amd64.exe; do
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -o "/tmp/assets/$asset" "https://github.com/faralidev/kolang-linter/releases/download/${VERSION}/$asset"; then
                break
              fi
              echo "تلاش $attempt ناموفق بود، ۱۵ ثانیه صبر..." >&2
              sleep 15
            done
            # verify the file downloaded
            test -s "/tmp/assets/$asset"
            HASHES[$asset]=$(sha256sum "/tmp/assets/$asset" | awk '{print $1}')
          done
          {
            echo "version=${VERSION}"
            echo "hb_version=${HB_VERSION}"
            echo "linux_amd64=${HASHES[kolang-linter-linux-amd64]}"
            echo "linux_arm64=${HASHES[kolang-linter-linux-arm64]}"
            echo "darwin_amd64=${HASHES[kolang-linter-darwin-amd64]}"
            echo "darwin_arm64=${HASHES[kolang-linter-darwin-arm64]}"
            echo "windows_amd64=${HASHES[kolang-linter-windows-amd64.exe]}"
          } >> "$GITHUB_OUTPUT"

      - name: Bump Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: faralidev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula/kolang-linter.rb
        env:
          PREFIX: kolang-linter
          VERSION: ${{ github.ref_name }}
          HB_VERSION: ${{ steps.hashes.outputs.hb_version }}
          HASH_LINUX_AMD64: ${{ steps.hashes.outputs.linux_amd64 }}
          HASH_LINUX_ARM64: ${{ steps.hashes.outputs.linux_arm64 }}
          HASH_DARWIN_AMD64: ${{ steps.hashes.outputs.darwin_amd64 }}
          HASH_DARWIN_ARM64: ${{ steps.hashes.outputs.darwin_arm64 }}
        run: |
          python3 - <<'PY'
          import os
          import re

          prefix = os.environ["PREFIX"]
          version = os.environ["VERSION"]
          hb_version = os.environ["HB_VERSION"]
          hashes = {
              "linux-amd64": os.environ["HASH_LINUX_AMD64"],
              "linux-arm64": os.environ["HASH_LINUX_ARM64"],
              "darwin-amd64": os.environ["HASH_DARWIN_AMD64"],
              "darwin-arm64": os.environ["HASH_DARWIN_ARM64"],
          }
          path = "homebrew-tap/Formula/kolang-linter.rb"

          with open(path, encoding="utf-8") as f:
              content = f.read()

          # Bump the `version` line (Homebrew convention: no leading "v").
          content = re.sub(
              r'^(\s*version\s+")[^"]*(")',
              lambda m: m.group(1) + hb_version + m.group(2),
              content,
              flags=re.M,
          )

          for platform, digest in hashes.items():
              asset = prefix + "-" + platform
              # Bump the tag inside the download URL for this asset (raw binary,
              # no .tar.gz/.zip extension).
              content = re.sub(
                  r'(url\s+"[^"]*/download/)v[^/]+(/' + re.escape(asset) + r'")',
                  lambda m: m.group(1) + version + m.group(2),
                  content,
              )
              # Set the sha256 that immediately follows the matching URL.
              content = re.sub(
                  r'(url\s+"[^"]*/download/' + re.escape(version) + r'/' + re.escape(asset) + r'"\s*\n\s*sha256\s+")[^"]*(")',
                  lambda m: m.group(1) + digest + m.group(2),
                  content,
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"Updated {path}: version={hb_version}")
          PY

      - name: Create Homebrew PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: kolang-linter-${{ github.ref_name }}
          title: "kolang-linter ${{ github.ref_name }}"
          commit-message: "kolang-linter ${{ github.ref_name }}: bump version + sha256"
          body: |
            Bump kolang-linter to ${{ github.ref_name }} and update the SHA256 hashes.

            Automated by the kolang-linter release workflow.

      - name: Bump Scoop bucket
        uses: actions/checkout@v5
        with:
          repository: faralidev/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update bucket/kolang-linter.json
        env:
          VERSION: ${{ github.ref_name }}
          HB_VERSION: ${{ steps.hashes.outputs.hb_version }}
          HASH_WINDOWS_AMD64: ${{ steps.hashes.outputs.windows_amd64 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          version = os.environ["VERSION"]
          hb_version = os.environ["HB_VERSION"]
          digest = os.environ["HASH_WINDOWS_AMD64"]
          path = "scoop-bucket/bucket/kolang-linter.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          data["version"] = hb_version
          arch = data["architecture"]["64bit"]
          arch["hash"] = digest
          arch["url"] = re.sub(r"/download/v[^/]+/", f"/download/{version}/", arch["url"])

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
              f.write("\n")
          print(f"Updated {path}: version={hb_version}")
          PY

      - name: Create Scoop PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          branch: kolang-linter-${{ github.ref_name }}
          title: "kolang-linter ${{ github.ref_name }}"
          commit-message: "kolang-linter ${{ github.ref_name }}: bump version + hash"
          body: |
            Bump kolang-linter to ${{ github.ref_name }} and update the Scoop manifest hash.

            Automated by the kolang-linter release workflow.